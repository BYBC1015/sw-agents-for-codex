name: SW CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main

jobs:
  windows-launcher:
    name: Windows Canvas lifecycle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r apps/media-canvas/requirements.txt
      - run: python -B -X utf8 -m unittest discover -s apps/media-canvas/tests -p test_launcher.py -v
  consistency:
    name: Repository consistency
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run SW repository checks
        run: python tools/sw_consistency_check.py --scope repo
      - name: Install Canvas image dependency
        run: python -m pip install -r apps/media-canvas/requirements.txt playwright
      - name: Install browser for Canvas interaction tests
        run: python -m playwright install --with-deps chromium
      - name: Test SW and protected generation locks
        run: python -B -m unittest discover -s tests -v
      - name: Test Canvas and storyboard continuity
        run: python -B -m unittest discover -s apps/media-canvas/tests -v
      - name: Check Canvas JavaScript
        run: |
          node --check apps/media-canvas/web/app.js
          node --check apps/media-canvas/web/projects.js
          node --check apps/media-canvas/web/storyboard.js
          node --check apps/media-canvas/web/site-tools.js
